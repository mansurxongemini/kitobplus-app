<IfModule mod_ssl.c>
<VirtualHost *:443>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	#ServerName www.example.com

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	#CustomLog ${APACHE_LOG_DIR}/access.log combined

	LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %{ms}Tms" combined_with_time_ms
	CustomLog ${APACHE_LOG_DIR}/access.log combined_with_time_ms

    #LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %Ts" combined_with_time
    #CustomLog ${APACHE_LOG_DIR}/access.log combined_with_time

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf


	ServerName kitobplus.uz
	Include /etc/letsencrypt/options-ssl-apache.conf
	ServerAlias www.kitobplus.uz
	SSLCertificateFile /etc/letsencrypt/live/kitobplus.uz/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/kitobplus.uz/privkey.pem

	<Directory /var/www/html>
		# Листинг каталогов выключен: раньше /api/, /pics/, /zip/, /drm/ открывались списком файлов.
		Options FollowSymLinks MultiViews
		AllowOverride all
		Require all granted
	</Directory>

	ServerSignature Off

	# Заголовки безопасности. Нужен mod_headers (a2enmod headers).
	# HSTS без includeSubDomains/preload: сначала убедиться, что все поддомены работают по HTTPS.
	# CSP пока не включён — см. docs/DEPLOY.md (проверять в режиме Report-Only на стенде).
	<IfModule mod_headers.c>
		Header always set Strict-Transport-Security "max-age=15552000"
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()"
		Header always unset X-Powered-By
	</IfModule>

	# Кэш: файлы сборки CRA содержат хэш в имени — год и immutable; index.html и manifest — всегда перепроверять,
	# иначе после выкладки браузер держит старую страницу со ссылками на удалённые чанки.
	<IfModule mod_headers.c>
		<LocationMatch "^/(admin/)?static/">
			Header set Cache-Control "public, max-age=31536000, immutable"
		</LocationMatch>
		<FilesMatch "^(index\.html|manifest\.json|asset-manifest\.json)$">
			Header set Cache-Control "no-cache"
		</FilesMatch>
	</IfModule>

	# Source map и служебные файлы наружу не отдаём (исходники сайта когда-то были восстановлены именно из .map).
	<FilesMatch "\.(map|sql|gz|log|bak|sh|env|yml|yaml|md)$">
		Require all denied
	</FilesMatch>
	<FilesMatch "^(composer\.(json|lock)|package(-lock)?\.json|\.env.*)$">
		Require all denied
	</FilesMatch>
	<DirectoryMatch "^/var/www/html/(\.git|docker|db|docs|deploy|scripts)(/|$)">
		Require all denied
	</DirectoryMatch>

	XSendFile On
	XSendFilePath /var/www/html
</VirtualHost>
</IfModule>
