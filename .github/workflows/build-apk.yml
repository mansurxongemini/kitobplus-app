name: Build Android APK

on:
  push:
    branches: [ main, master, restore-build ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build KitobPlus APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Application
        working-directory: ./web
        run: npm run build
        env:
          CI: false

      - name: Sync Capacitor Android
        working-directory: ./web
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x web/android/gradlew

      - name: Build Android Debug APK
        working-directory: ./web/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitobPlus-Debug-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
