# Локальная копия deploy/000-default-le-ssl.conf без SSL.
# Отличие от сервера: листинг каталогов (Options Indexes) выключен.
<VirtualHost *:80>
	ServerName localhost
	SetEnv KP_ENV local
	DocumentRoot /var/www/html
	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Репозиторий смонтирован в /var/www/html целиком; служебные папки наружу не отдаём.
	<DirectoryMatch "^/var/www/html/(\.git|docker|db|docs|deploy|scripts|web|admin|\.local)(/|$)">
		Require all denied
	</DirectoryMatch>

	# На сервере корень сайта отдаёт сборку React. Локально сайт работает на dev-сервере (порт 3000),
	# а здесь вместо него заглушка, чтобы правило из .htaccess (всё на /index.html) не зацикливалось.
	Alias /index.html /opt/kitobplus/index.html
	<Directory /opt/kitobplus>
		Require all granted
	</Directory>

	XSendFile On
	XSendFilePath /var/www/html
</VirtualHost>
