# Локальная копия deploy/000-default-le-ssl.conf без SSL.
# Отличие от сервера: листинг каталогов (Options Indexes) выключен.
<VirtualHost *:80>
	ServerName localhost
	SetEnv KP_ENV local
	DocumentRoot /var/www/html
	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Репозиторий смонтирован в /var/www/html целиком; служебные папки наружу не отдаём.
	<DirectoryMatch "^/var/www/html/(\.git|docker|db|docs|deploy|scripts|web|admin|\.local)(/|$)">
		Require all denied
	</DirectoryMatch>

	# На сервере корень сайта отдаёт сборку React. Локально сайт работает на dev-сервере (порт 3000),
	# а здесь вместо него заглушка, чтобы правило из .htaccess (всё на /index.html) не зацикливалось.
	Alias /index.html /opt/kitobplus/index.html
	<Directory /opt/kitobplus>
		Require all granted
	</Directory>

	# Те же заголовки, кэш и запреты, что в deploy/000-default-le-ssl.conf (кроме HSTS — здесь нет HTTPS).
	ServerSignature Off
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()"
		Header always unset X-Powered-By
		<LocationMatch "^/(admin/)?static/">
			Header set Cache-Control "public, max-age=31536000, immutable"
		</LocationMatch>
		<FilesMatch "^(index\.html|manifest\.json|asset-manifest\.json)$">
			Header set Cache-Control "no-cache"
		</FilesMatch>
	</IfModule>
	<FilesMatch "\.(map|sql|gz|log|bak|sh|env|yml|yaml|md)$">
		Require all denied
	</FilesMatch>
	<FilesMatch "^(composer\.(json|lock)|package(-lock)?\.json|\.env.*)$">
		Require all denied
	</FilesMatch>

	XSendFile On
	XSendFilePath /var/www/html
</VirtualHost>
