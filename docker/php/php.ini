; Код подключается к базе как mysqli('localhost', ...): это unix-сокет.
; В docker-compose сокет MariaDB смонтирован в общий том /run/mysqld.
mysqli.default_socket = /run/mysqld/mysqld.sock

date.timezone = Asia/Tashkent
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M

; Ошибки в лог контейнера, не в ответ: API отдаёт JSON.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED
